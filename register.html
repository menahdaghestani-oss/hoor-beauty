<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>التسجيل وحجز موعد - مركز حور</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #fdf8f5;
            margin: 0;
            padding: 0;
        }
        nav {
            position: sticky;
            top: 0;
            background-color: #c98a8a;
            padding: 12px 15px;
            text-align: center;
            z-index: 1000;
        }
        nav a {
            color: white;
            text-decoration: none;
            margin: 0 8px;
            font-weight: bold;
            padding: 7px 12px;
            display: inline-block;
        }
        nav a:hover {
            background-color: #2a9d8f;
            border-radius: 6px;
        }
        .form-container {
            width: 85%;
            max-width: 600px;
            margin: 30px auto;
            background-color: #ffffff;
            padding: 25px;
            border: 2px solid #c98a8a;
            border-radius: 12px;
        }
        h1 {
            text-align: center;
            color: #a66363;
        }
        .field-box {
            margin-bottom: 18px;
        }
        label {
            font-weight: bold;
            color: #333;
        }
        input[type="text"], input[type="email"], input[type="tel"], select {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
        }
        .submit-btn {
            background-color: #2a9d8f;
            color: white;
            border: none;
            padding: 12px;
            font-size: 17px;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
        }
        .submit-btn:hover {
            background-color: #21867a;
        }
    </style>
</head>
<body>

    <nav>
        <a href="index.html">الرئيسية</a>
        <a href="about.html">نبذة عن المركز</a>
        <a href="videos.html">الفيديوهات</a>
        <a href="register.html">التسجيل وحجز موعد</a>
        <a href="contact.html">تواصل معنا</a>
    </nav>

    <div class="form-container">
        <h1>التسجيل وحجز موعد جديد</h1>

        <!-- نموذج التسجيل المتكامل -->
        <form action="#" method="post">
            <div class="field-box">
                <label for="client_name">الاسم الكامل:</label>
                <input type="text" id="client_name" name="client_name" placeholder="أدخلي الاسم الكامل" required>
            </div>

            <div class="field-box">
                <label for="client_email">البريد الإلكتروني:</label>
                <input type="email" id="client_email" name="client_email" placeholder="name@example.com" required>
            </div>

            <div class="field-box">
                <label for="client_phone">رقم الهاتف:</label>
                <input type="tel" id="client_phone" name="client_phone" placeholder="05xxxxxxxx" required>
            </div>

            <!-- خياران radio بنفس name -->
            <div class="field-box">
                <label>الجنس:</label><br>
                <input type="radio" id="female" name="gender" value="female" checked>
                <label for="female">أنثى</label>
                &nbsp;&nbsp;&nbsp;
                <input type="radio" id="male" name="gender" value="male">
                <label for="male">ذكر</label>
            </div>

            <!-- ثلاث خانات checkbox -->
            <div class="field-box">
                <label>اختاري الخدمات المطلوبة:</label><br>
                <input type="checkbox" id="chk1" name="services" value="hydrafacial">
                <label for="chk1">تنظيف البشرة العميق (هيدرافيشل)</label><br>

                <input type="checkbox" id="chk2" name="services" value="meso">
                <label for="chk2">جلسة ميزوثيرابي ونضارة</label><br>

                <input type="checkbox" id="chk3" name="services" value="laser">
                <label for="chk3">جلسة ليزر لإزالة الشعر</label>
            </div>

            <!-- قائمة منسدلة select بثلاثة خيارات -->
            <div class="field-box">
                <label for="branch_select">الفرع المفضل:</label>
                <select id="branch_select" name="branch">
                    <option value="jeddah">جدة - حي الروضة</option>
                    <option value="riyadh">الرياض - حي العليا</option>
                    <option value="dammam">الدمام - حي الشاطئ</option>
                </select>
            </div>

            <button type="submit" class="submit-btn">إرسال البيانات وحجز الموعد</button>
        </form>

        <hr>
        <p style="text-align: center;">
            <a href="index.html" style="color: #a66363; font-weight: bold;">الرجوع إلى الصفحة الرئيسية</a>
        </p>
    </div>

</body>
</html>
